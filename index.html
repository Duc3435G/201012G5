<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hộp Quà Bất Ngờ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Container chính */
        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        /* Tiêu đề hướng dẫn */
        .hint-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            animation: bounceText 2s infinite ease-in-out;
            transition: opacity 0.5s ease;
        }

        @keyframes bounceText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Hộp quà */
        .gift-box {
            position: relative;
            width: 180px;
            height: 180px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .gift-box:hover {
            transform: scale(1.05);
        }

        /* Thân hộp quà */
        .gift-body {
            position: absolute;
            bottom: 0;
            width: 180px;
            height: 140px;
            background: linear-gradient(135deg, #e11d48, #be123c);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                        inset 0 -10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Nắp hộp quà */
        .gift-lid {
            position: absolute;
            top: 20px;
            left: -10px;
            width: 200px;
            height: 40px;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2;
        }

        /* Nơ & Dây ruy băng */
        .ribbon-vertical {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 100%;
            background: linear-gradient(90deg, #fef08a, #facc15, #eab308);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .ribbon-horizontal {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 30px;
            background: linear-gradient(180deg, #fef08a, #facc15, #eab308);
        }

        .bow {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 35px;
            z-index: 3;
        }

        .bow-left, .bow-right {
            position: absolute;
            width: 35px;
            height: 30px;
            border: 5px solid #facc15;
            border-radius: 50% 50% 0 50%;
            background: #eab308;
        }

        .bow-left {
            left: -5px;
            transform: rotate(-20deg);
        }

        .bow-right {
            right: -5px;
            transform: scaleX(-1) rotate(-20deg);
        }

        /* Hiệu ứng MỞ QUÀ */
        .gift-box.open .gift-lid {
            transform: translateY(-160px) rotate(-20deg) scale(0.9);
        }

        .gift-box.open {
            animation: popBox 0.4s ease forwards;
        }

        @keyframes popBox {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        /* Khung chứa nội dung thông điệp */
        .message-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(250, 204, 21, 0.4);
            color: #1e293b;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            min-width: 320px;
        }

        .message-card.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .message-card h2 {
            color: #e11d48;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .message-card p {
            font-size: 1.25rem;
            font-weight: 600;
            color: #334155;
            line-height: 1.6;
        }

        .close-btn {
            margin-top: 1.5rem;
            padding: 0.6rem 1.5rem;
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(225, 29, 72, 0.4);
        }

        /* Hiệu ứng Pháo hoa / Hạt lấp lánh Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="container">
        <div class="hint-text" id="hint">🎁 Bấm vào hộp quà để mở!</div>

        <div class="gift-box" id="giftBox">
            <div class="gift-lid">
                <div class="ribbon-vertical"></div>
                <div class="bow">
                    <div class="bow-left"></div>
                    <div class="bow-right"></div>
                </div>
            </div>
            <div class="gift-body">
                <div class="ribbon-vertical"></div>
            </div>
        </div>
    </div>

    <!-- Khung thông điệp hiển thị khi mở -->
    <div class="message-card" id="messageCard">
        <h2>🎉 Chúc Mừng! 🎉</h2>
        <p id="messageText">Đây là nội dung hiển thị</p>
        <button class="close-btn" id="closeBtn">Đóng lại</button>
    </div>

    <script>
        const giftBox = document.getElementById('giftBox');
        const hintText = document.getElementById('hint');
        const messageCard = document.getElementById('messageCard');
        const closeBtn = document.getElementById('closeBtn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let isOpen = false;

        // Resize Canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Lớp hiệu ứng Hạt lấp lánh (Confetti / Fireworks)
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 4;
                this.speedX = (Math.random() - 0.5) * 12;
                this.speedY = (Math.random() - 0.7) * 14;
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                this.gravity = 0.25;
                this.friction = 0.98;
                this.opacity = 1;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 10;
            }

            update() {
                this.speedY += this.gravity;
                this.speedX *= this.friction;
                this.speedY *= this.friction;
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity -= 0.015;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        // Tạo hiệu ứng nổ pháo hoa
        function createExplosion() {
            const rect = giftBox.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 3;

            for (let i = 0; i < 80; i++) {
                particles.push(new Particle(centerX, centerY));
            }
        }

        // Vòng lặp vẽ pháo hoa
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.opacity <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Sự kiện Bấm vào Hộp Quà
        giftBox.addEventListener('click', () => {
            if (isOpen) return;
            isOpen = true;

            // Mở hộp quà
            giftBox.classList.add('open');
            hintText.style.opacity = '0';

            // Tạo hiệu ứng pháo hoa
            createExplosion();

            // Hiển thị thông điệp sau khi nắp mở
            setTimeout(() => {
                messageCard.classList.add('show');
            }, 400);
        });

        // Nút đóng
        closeBtn.addEventListener('click', () => {
            messageCard.classList.remove('show');
            setTimeout(() => {
                giftBox.classList.remove('open');
                hintText.style.opacity = '1';
                isOpen = false;
            }, 300);
        });
    </script>
</body>
</html>
